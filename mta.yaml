_schema-version: "3.1"
ID: poc-cash
version: 1.0.0
description: AI Agent Cash Matching Dashboard
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci --ignore-scripts
        - npm run build:mta

modules:
  - name: poc-cash-srv
    type: nodejs
    path: gen/srv
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      memory: 512M
      disk-quota: 512M
    requires:
      - name: poc-cash-uaa
      - name: dest-service
      - name: ai-core-srv

  - name: poc-cash-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    requires:
      - name: poc-cash-uaa
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
          strictSSL: true

resources:
  - name: ai-core-srv
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: ai-core-srv

  - name: dest-service
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: dest-service

  - name: poc-cash-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: xs-security.json
      config:
        oauth2-configuration:
          token-validity: 3600
