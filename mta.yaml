_schema-version: "3.1"
ID: poc-cash
version: 1.0.0
description: AI Agent Cash Matching Dashboard
parameters:
  enable-parallel-deployments: true

modules:
  - name: poc-cash-srv
    type: nodejs
    path: gen/srv
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      memory: 512M
      disk-quota: 512M
    requires:
      - name: poc-cash-uaa

  - name: poc-cash-app
    type: html5
    path: app/cashsync-ui
    parameters:
      memory: 256M
      disk-quota: 256M
    requires:
      - name: poc-cash-uaa

  - name: poc-cash-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 256M
      disk-quota: 256M
      keep-existing-routes: true
    requires:
      - name: poc-cash-uaa
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: false
          strictSSL: true

resources:
  - name: poc-cash-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: xs-security.json
      config:
        oauth2-configuration:
          token-validity: 3600
